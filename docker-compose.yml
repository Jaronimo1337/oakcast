services:
  db:
    image: postgres:16-alpine
    container_name: oakcast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oakcast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: oakcast-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: oakcast
      DB_USER: postgres
      DB_PASSWORD: postgres
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      ADMIN_JWT_SECRET: replace-with-a-long-random-secret-in-production
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: oakcast-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
